name: Release

# Fires on any tag like v0.1.0, v1.2.3, etc. Builds + pushes the backend
# and frontend images to GitHub Container Registry (ghcr.io) and creates
# a GitHub Release with autogenerated notes.
#
# Multi-arch strategy: each platform builds on its OWN native runner
# (linux/amd64 on ubuntu-latest, linux/arm64 on ubuntu-24.04-arm),
# pushed by digest only. A merge job then stitches the per-arch digests
# into a single tagged multi-arch manifest with `docker buildx
# imagetools create`. This sidesteps QEMU emulation for arm64, dropping
# a typical release from ~25 min to ~8–10 min once caches warm.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)release, e.g. v0.1.0'
        required: true

permissions:
  contents: write   # required to create the Release
  packages: write   # required to push to ghcr.io

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    name: Build ${{ matrix.service }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            image: llm-wiki-backend
            platform: linux/amd64
            runner: ubuntu-latest
            arch_tag: linux-amd64
          - service: backend
            context: ./backend
            image: llm-wiki-backend
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_tag: linux-arm64
          - service: frontend
            context: ./frontend
            image: llm-wiki-frontend
            platform: linux/amd64
            runner: ubuntu-latest
            arch_tag: linux-amd64
          - service: frontend
            context: ./frontend
            image: llm-wiki-frontend
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_tag: linux-arm64
          - service: mineru
            context: ./mineru
            image: llm-wiki-mineru
            platform: linux/amd64
            runner: ubuntu-latest
            arch_tag: linux-amd64
          - service: mineru
            context: ./mineru
            image: llm-wiki-mineru
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_tag: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest only — no tag yet. The merge job below stitches
      # the two per-arch digests into the actual tagged manifest list.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch_tag }}
          cache-to: type=gha,scope=${{ matrix.service }}-${{ matrix.arch_tag }},mode=max
          outputs: |
            type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service }}-${{ matrix.arch_tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge ${{ matrix.service }} manifest
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            image: llm-wiki-backend
          - service: frontend
            image: llm-wiki-frontend
          - service: mineru
            image: llm-wiki-mineru
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.service }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          # Produces: :vX.Y.Z, :X.Y.Z, :X.Y, :latest (latest only on stable tags)
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      # `imagetools create` accepts one or more digests and tags the
      # combined manifest list with all tags emitted by metadata-action.
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}@sha256:%s ' *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}

  release:
    name: Create GitHub Release
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for the changelog generator

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build runtime bundle
        id: bundle
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          DIR="llm-wiki-${TAG}"
          mkdir -p "$DIR/raw" "$DIR/vault"
          # `vault/` is shipped empty (just .gitkeep) so installs start
          # clean. Demo content lives in `examples/vault/` and is only
          # imported when SEED_EXAMPLES=true.
          cp -r examples config "$DIR/"
          cp docker-compose.yml docker-compose.prod.yml .env.example README.md "$DIR/"
          touch "$DIR/raw/.gitkeep" "$DIR/vault/.gitkeep"
          ARCHIVE="llm-wiki-${TAG}-bundle.tar.gz"
          tar czf "$ARCHIVE" "$DIR"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          ls -lh "$ARCHIVE"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: ${{ steps.bundle.outputs.archive }}
          body: |
            ## Quick install (no clone required)

            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/llm-wiki-${{ steps.tag.outputs.name }}-bundle.tar.gz | tar xz
            cd llm-wiki-${{ steps.tag.outputs.name }}
            cp .env.example .env   # then edit for API keys
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            ```

            The bundle ships compose files, seed `vault/` pages, the `config/agents.md`
            playbook, an empty `raw/`, and `.env.example`. Images pull from ghcr.io
            automatically — no source build needed.

            ## Docker images

            - Backend / Worker → `ghcr.io/${{ github.repository_owner }}/llm-wiki-backend:${{ steps.tag.outputs.name }}`
            - Frontend         → `ghcr.io/${{ github.repository_owner }}/llm-wiki-frontend:${{ steps.tag.outputs.name }}`
            - MinerU           → `ghcr.io/${{ github.repository_owner }}/llm-wiki-mineru:${{ steps.tag.outputs.name }}` (opt-in; set `MINERU_ENABLED=true`)

            All are multi-arch (`linux/amd64` + `linux/arm64`).
