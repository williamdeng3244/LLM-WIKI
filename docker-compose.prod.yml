# Override to run the published images from GitHub Container Registry
# instead of building locally. Use with:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Pin TAG in .env (TAG=v0.2.0) to lock to a specific release; defaults
# to :latest which always points at the newest stable tag.
#
# This file `!reset`s the dev-only `command:` override from the base
# compose so the published image's CMD (real prod servers — uvicorn
# multi-worker for backend, `next start` for frontend) takes effect.
services:
  backend:
    build: !reset null
    image: ghcr.io/williamdeng3244/llm-wiki-backend:${TAG:-latest}
    command: !reset null
    # Production runs on the EXTERNAL API model — there is no local LLM.
    # The base compose already defaults LLM_PROVIDER=anthropic /
    # CHAT_MODEL=claude-sonnet-4-6; reaffirmed here so the prod deploy is
    # explicit about the model. Set ANTHROPIC_API_KEY in .env. To use a
    # different *hosted* API, set LLM_PROVIDER=openai + OPENAI_API_KEY + a
    # hosted OPENAI_BASE_URL — never point it at a local model server.
    # Embeddings are likewise API-only (provider `openai`): the wiki ships no
    # local embedding model. Set EMBEDDINGS_API_KEY (+ EMBEDDINGS_BASE_URL for
    # Azure / an internal gateway); EMBEDDING_DIM must match the model (1536 =
    # text-embedding-3-small). After a 384->1536 upgrade on an existing DB, run
    # `python -m app.scripts.backfill_embeddings` once to re-embed.
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      CHAT_MODEL: ${CHAT_MODEL:-claude-sonnet-4-6}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-openai}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-text-embedding-3-small}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
    # `!override` fully replaces the base file's volume list (it does
    # NOT merge), so the artifact storage mount has to be re-listed here
    # too — otherwise prod loses persistence for /a/<short_id> bodies.
    volumes: !override
      - ./vault:/vault
      - ./raw:/raw
      - ./config:/config
      - ./examples/vault:/examples/vault:ro
      - artifacts_data:/data/artifacts

  worker:
    build: !reset null
    image: ghcr.io/williamdeng3244/llm-wiki-backend:${TAG:-latest}
    # The Celery worker also calls the LLM (ingest / lint tasks) AND re-embeds
    # pages on ingest — keep it on the same external API model + embeddings
    # provider as the backend.
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      CHAT_MODEL: ${CHAT_MODEL:-claude-sonnet-4-6}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-openai}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-text-embedding-3-small}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
    volumes: !override
      - ./vault:/vault
      - ./raw:/raw
      - ./config:/config
      - ./examples/vault:/examples/vault:ro

  frontend:
    build: !reset null
    image: ghcr.io/williamdeng3244/llm-wiki-frontend:${TAG:-latest}
    command: !reset null
    volumes: !override []

  # MinerU sidecar — opt-in. The image bundles MinerU 3.x's pipeline
  # backend (DocLayout-YOLO + transformers OCR); first parse downloads
  # ~1 GB of model weights into the `mineru_models` volume.
  # Enable by setting MINERU_ENABLED=true in .env (defaults to off so
  # the backend uses Anthropic's native PDF block instead).
  mineru:
    build: !reset null
    image: ghcr.io/williamdeng3244/llm-wiki-mineru:${TAG:-latest}

  # ── PostgreSQL (production tuning + hardening) ─────────────────────────
  # The base compose defines `db` (pgvector/pgvector:pg16, a persistent
  # `db_data` volume, and a pg_isready healthcheck). This override tunes it
  # for the 700–900-staff deployment:
  #   • max_connections 100 → 200 — under the load test, the 4 uvicorn
  #     workers + the Celery worker + the SQLAlchemy pools drove ~82 live
  #     connections, close to Postgres's default 100 cap
  #     (docs/srs/performance-report.md §6.5).
  #   • shared_buffers / effective_cache_size / work_mem / maintenance_work_mem
  #     — modest prod memory settings sized for a ~2–4 GB Postgres allotment;
  #     raise them to match your DB host's RAM.
  #   • The host port (5432) is REMOVED — Postgres is reachable only on the
  #     internal docker network (backend + worker). Re-add a `ports:` mapping
  #     if a DBA tool on the host must connect directly.
  # Also set a STRONG POSTGRES_PASSWORD in .env — the base default (`wiki`)
  # is for local dev only.
  db:
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=128MB"
    shm_size: "256mb"
    ports: !override []
