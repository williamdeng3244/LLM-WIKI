# Override to run the published images from GitHub Container Registry
# instead of building locally. Use with:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Pin TAG in .env (TAG=v0.2.0) to lock to a specific release; defaults
# to :latest which always points at the newest stable tag.
#
# This file `!reset`s the dev-only `command:` override from the base
# compose so the published image's CMD (real prod servers — uvicorn
# multi-worker for backend, `next start` for frontend) takes effect.
services:
  backend:
    build: !reset null
    image: ghcr.io/williamdeng3244/llm-wiki-backend:${TAG:-latest}
    command: !reset null
    volumes: !override
      - ./vault:/vault
      - ./raw:/raw
      - ./config:/config

  worker:
    build: !reset null
    image: ghcr.io/williamdeng3244/llm-wiki-backend:${TAG:-latest}
    volumes: !override
      - ./vault:/vault
      - ./raw:/raw
      - ./config:/config

  frontend:
    build: !reset null
    image: ghcr.io/williamdeng3244/llm-wiki-frontend:${TAG:-latest}
    command: !reset null
    volumes: !override []
