services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wiki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wiki}
      POSTGRES_DB: ${POSTGRES_DB:-wiki}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-wiki}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    # Dev-only command override: image CMD is the prod multi-worker uvicorn
    # (no --reload). For dev workflow with bind-mounted source, swap in
    # --reload + single worker so file edits hot-reload.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wiki}:${POSTGRES_PASSWORD:-wiki}@db:5432/${POSTGRES_DB:-wiki}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-claude-sonnet-4-6}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      # Embeddings (see app/core/config.py). Dev + CI default to `none`
      # (embeddings disabled -> lexical search) so the suite is green with NO
      # key; set EMBEDDINGS_PROVIDER=openai + EMBEDDINGS_API_KEY for real
      # semantic search. docker-compose.prod.yml pins `openai`.
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-none}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-text-embedding-3-small}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      MINERU_ENABLED: ${MINERU_ENABLED:-false}
      MINERU_URL: ${MINERU_URL:-http://mineru:8080}
      VAULT_PATH: /vault
      SEED_EXAMPLES: ${SEED_EXAMPLES:-false}
      EXAMPLES_VAULT_PATH: /examples/vault
      URL_INGEST_TIMEOUT_SECONDS: ${URL_INGEST_TIMEOUT_SECONDS:-60}
      URL_INGEST_MAX_BYTES: ${URL_INGEST_MAX_BYTES:-52428800}
      URL_INGEST_ALLOW_PRIVATE: ${URL_INGEST_ALLOW_PRIVATE:-false}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      AUTH_MODE: ${AUTH_MODE:-stub}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:3000/auth/callback}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      DEFAULT_OIDC_ROLE: ${DEFAULT_OIDC_ROLE:-reader}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      ARTIFACTS_STORAGE_DIR: ${ARTIFACTS_STORAGE_DIR:-/data/artifacts}
      ARTIFACTS_MAX_BODY_BYTES: ${ARTIFACTS_MAX_BODY_BYTES:-10485760}
      ARTIFACTS_ALLOW_PUBLIC: ${ARTIFACTS_ALLOW_PUBLIC:-false}
      ARTIFACTS_DEFAULT_EXPIRY_DAYS: ${ARTIFACTS_DEFAULT_EXPIRY_DAYS:-}
    volumes:
      - ./vault:/vault
      - ./raw:/raw
      - ./config:/config
      - ./backend:/app
      # Bundled demo pages, read-only. Only imported when
      # SEED_EXAMPLES=true (see config.py).
      - ./examples/vault:/examples/vault:ro
      # Gated artifact bodies (display.dev / Flowershow style share links).
      # Named volume so blobs survive container rebuilds.
      - artifacts_data:/data/artifacts
    ports:
      - "8000:8000"
    # Python is in the slim image (curl is not). start_period gives the
    # FastAPI lifespan time to wait for DB + run schema bootstrap.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health',timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    # Listen on BOTH queues: 'default' (current task_routes config in
    # backend/app/worker.py routes app.worker.* there) plus 'celery'
    # (the implicit name in case task_routes is ever dropped). Missing
    # -Q was Bug #5 — tasks piled up in 'default' while the worker
    # idled on 'celery' for 18 days.
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=info", "-Q", "default,celery"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wiki}:${POSTGRES_PASSWORD:-wiki}@db:5432/${POSTGRES_DB:-wiki}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-claude-sonnet-4-6}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      # Embeddings — the worker re-embeds on ingest; keep it on the same
      # provider as the backend (dev/CI default `none`; prod pins `openai`).
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-none}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-text-embedding-3-small}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      MINERU_ENABLED: ${MINERU_ENABLED:-false}
      MINERU_URL: ${MINERU_URL:-http://mineru:8080}
      VAULT_PATH: /vault
      SEED_EXAMPLES: ${SEED_EXAMPLES:-false}
      EXAMPLES_VAULT_PATH: /examples/vault
    volumes:
      - ./vault:/vault
      - ./raw:/raw
      - ./config:/config
      - ./backend:/app
      - ./examples/vault:/examples/vault:ro
    # Probe the broker directly so docker-compose can restart the worker
    # if its Redis connection dies silently (Bug #2). Without this the
    # worker's `unless-stopped` policy doesn't help — the process IS
    # alive, it's just spinning in retry-connect forever.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, redis; redis.from_url(os.environ['REDIS_URL']).ping()\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    # Dev override: image CMD is `npm start` (prod). For dev with bind-mount
    # we want the dev server (hot reload + fast refresh).
    command: ["npm", "run", "dev"]
    # Gate on backend being *healthy*, not just started — fixes the case
    # where the page loads but the API is dead.
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_AUTH_MODE: ${AUTH_MODE:-stub}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    # wget is in busybox (default in node:alpine).
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # MinerU sidecar — high-fidelity PDF → Markdown. CPU-only.
  # First build pulls multi-GB of torch + paddleocr + layout-model
  # dependencies; first parse downloads ~5GB of model weights to
  # /data/.cache (persisted by the mineru_models volume below).
  # The backend talks to it on the internal network at http://mineru:8080.
  # To enable: set MINERU_ENABLED=true in .env, then
  #   docker compose build mineru && docker compose up -d mineru
  mineru:
    build: ./mineru
    restart: unless-stopped
    environment:
      HOME: /data
      MINERU_DEVICE_MODE: cpu
    volumes:
      - mineru_models:/data
    # start_period is large because first parse pulls model weights.
    # After that, the /health endpoint responds in ms.
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/health\")' || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    # Optionally expose for local poking. Backend talks via the docker
    # network and doesn't need this.
    ports:
      - "8081:8080"

volumes:
  db_data:
  redis_data:
  mineru_models:
  artifacts_data:
